<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#160d08">
<title>Bridge Maman</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=90">
</head>
<body>
<div id="viewport">
<main id="game" class="game">
  <div class="wood"></div>
  <div class="table"></div>

  <div class="dealBadge" id="dealInfo">Donne 1</div>

  <div class="player northVisual"><div class="avatar">👨🏻</div></div>
  <div class="player westVisual"><div class="avatar">🧑🏻</div></div>
  <div class="player eastVisual"><div class="avatar">👩🏼</div></div>

  <div class="namePlate northPlate" id="plateN"><b>NORD</b><span>Jean</span><small>Robot</small></div>
  <div class="namePlate westPlate" id="plateW"><b>OUEST</b><span>Marc</span><small>Robot</small></div>
  <div class="namePlate eastPlate" id="plateE"><b>EST</b><span>Claire</span><small>Robot</small></div>
  <div class="namePlate southPlate active" id="plateS"><b>SUD - Vous</b><span>Joueur</span></div>

  <div id="seatN" class="engineSeat"></div>
  <div id="seatW" class="engineSeat"></div>
  <div id="seatE" class="engineSeat"></div>
  <div id="seatS" class="engineSeat"></div>

  <section class="auctionPanel" id="bidControls">
    <h2>ENCHÈRES</h2>
    <div class="prettyHeader">
      <span class="redSuit">♥</span><span>♠</span><span class="redSuit">♦</span><span>♣</span><span>SA</span>
    </div>
    <div class="prettyBids" id="prettyBids"></div>
    <div class="engineBid">
      <div id="bidLevels"></div>
      <div id="strainRow"></div>
    </div>
    <div class="auctionActions">
      <button id="redoubleBtn" class="xx">XX</button>
      <button id="doubleBtn" class="x">X</button>
      <button id="passBtn" class="pass">PASSE</button>
    </div>
  </section>

  <section class="rightRail">
    <div class="box">
      <h2>CONTRAT</h2>
      <div id="contractPretty" class="contractPretty"><strong>—</strong><span>Enchères</span></div>
      <h3>ENTAME</h3>
      <div id="leadPretty" class="leadPretty">—</div>
      <h3>SCORE</h3>
      <div class="score"><span>Nous</span><span>Eux</span><b id="scoreNS">0</b><b id="scoreEW">0</b></div>
    </div>
    <div class="box historyBox">
      <h2>HISTORIQUE</h2>
      <div class="histHead"><span>Joueur</span><span>Enchère</span></div>
      <div id="historyBody"></div>
    </div>
  </section>

  <section class="tableCore">
    <div id="auctionPanel" class="engineAuction">
      <table><tbody id="auctionBody"></tbody></table>
      <div id="contractLine">Enchères en cours.</div>
    </div>
    <div id="playPanel" class="hidden">
      <div class="played n" id="trickN">—</div>
      <div class="played w" id="trickW">—</div>
      <div class="compass">N<br><span>O ◇ E</span><br>S</div>
      <div class="played e" id="trickE">—</div>
      <div class="played s" id="trickS">—</div>
      <div id="scoreLine" class="hidden"></div>
    </div>
  </section>

  <section class="handWrap southHand" id="southWrap">
    <div class="handLabel" id="southLabel">Votre main — Sud <span id="southHcp"></span></div>
    <div class="hand" id="handS"></div>
  </section>

  <section class="handWrap dummyWrap hidden" id="dummyWrap">
    <div class="handLabel" id="dummyLabel">Mort</div>
    <div class="hand" id="dummyHand"></div>
  </section>

  <section class="playControls hidden" id="playControls">
    <button id="hintCardBtn">💡 CONSEIL CARTE</button>
    <button id="analysisBtn">ANALYSE</button>
    <button id="claimBtn">FINIR AUTO</button>
  </section>

  <div class="status" id="status">Distribution en cours…</div>

  <footer class="bottomBar">
    <button id="backBtn">↶ REVENIR</button>
    <button id="adviceBtn">💡 CONSEIL</button>
    <button id="replayDealBtn">🃏 REJOUER LA DONNE</button>
    <button id="newDealBtn">↻ NOUVELLE DONNE</button>
  </footer>

  <button id="hintBidBtn" class="hidden">Conseil</button>
  <button id="installBtn" class="hidden">Installer</button>
</main>
</div>

<script src="app.js?v=90"></script>
<script>
(() => {
  const DISPLAY=['♥','♠','♦','♣','SA'];
  const wrap=document.getElementById('prettyBids');
  for(let level=1; level<=7; level++){
    DISPLAY.forEach(s=>{
      const b=document.createElement('button');
      b.innerHTML=level+(s==='SA'?'SA':'<span class="'+((s==='♥'||s==='♦')?'redSuit':'')+'">'+s+'</span>');
      b.onclick=()=>{
        const levelButtons=[...document.querySelectorAll('#bidLevels button')];
        levelButtons[level-1]?.click();
        const strainButtons=[...document.querySelectorAll('#strainRow button')];
        strainButtons.find(x=>x.textContent.trim()===s)?.click();
      };
      wrap.appendChild(b);
    });
  }

  const byId=id=>document.getElementById(id);
  byId('adviceBtn').onclick=()=>{
    const playing=!byId('playControls').classList.contains('hidden');
    (playing?byId('hintCardBtn'):byId('hintBidBtn')).click();
  };
  byId('backBtn').onclick=()=>history.back();

  function fitGame(){
    const g=byId('game'), v=byId('viewport');
    const scale=Math.min(window.innerWidth/1280, window.innerHeight/720);
    g.style.transform=`scale(${scale})`;
    v.style.width=(1280*scale)+'px';
    v.style.height=(720*scale)+'px';
  }
  addEventListener('resize',fitGame);
  addEventListener('orientationchange',()=>setTimeout(fitGame,120));
  fitGame();
})();
</script>
</body>
</html>
